[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mlbr"
version = "0.1.0"
description = "Maximum-likelihood bandpower reconstruction tools"
requires-python = ">=3.9"
dependencies = [
    "fgspectra",
    "matplotlib",
    "numpy",
    "sacc",
    "scipy",
]

[project.optional-dependencies]
likelihood = ["cobaya"]

[tool.setuptools]
py-modules = ["mlbr", "MLBRLike"]